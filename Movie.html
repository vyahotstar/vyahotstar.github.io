<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="VyaHotstar - Watch Kurukshetra and discover movies, TV shows and entertainment.">

  <title>vyahotstar</title>

  <link rel="icon" href="VYA NEW.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #08090d;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      border: 0;
      cursor: pointer;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */
.nav-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 21px;
}

.nav-link {
  color: #fff;
  text-decoration: none;
}

.nav-label {
  color: #fff;
}
    .sidebar {
      position: fixed;
      z-index: 1000;
      left: 18px;
      top: 18px;
      width: 70px;
      height: calc(100vh - 36px);

      display: flex;
      flex-direction: column;

      padding: 18px 10px;

      background: rgba(15,17,23,0\.48);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      transition:
        width 0.3s ease,
        background 0.3s ease;
    }

    .sidebar:hover {
      width: 210px;
      background: rgba(12, 14, 20, 0.72);
    }

    /* Brand */

    .brand {
      height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
      margin-bottom: 28px;
      overflow: hidden;
      white-space: nowrap;
    }

    .brand-star {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      background: linear-gradient(145deg, #ff2100, #ff6a00);
      color: #fff;

      font-size: 22px;
      font-weight: 900;

      clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 56%,
        79% 92%,
        50% 70%,
        21% 92%,
        32% 56%,
        2% 35%,
        39% 35%
      );

      filter: drop-shadow(0 5px 12px rgba(255, 58, 0, 0.35));

      transition: transform 0.3s ease;
    }

    .sidebar:hover .brand-star {
      transform: rotate(12deg) scale(1.04);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;

      opacity: 0;
      transform: translateX(-8px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .sidebar:hover .brand-name {
      opacity: 1;
      transform: translateX(0);
    }

    /* Navigation */

    .nav {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nav-link {
      position: relative;

      min-height: 48px;
      display: flex;
      align-items: center;

      padding: 0 11px;
      border-radius: 13px;

      color: rgba(255, 255, 255, 0.65);

      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-link.active::before {
      content: "";

      position: absolute;
      left: -10px;
      width: 3px;
      height: 22px;

      background: #ff3b12;
      border-radius: 5px;

      box-shadow: 0 0 12px rgba(255, 59, 18, 0.65);
    }

    .nav-icon {
      flex: 0 0 26px;

      width: 26px;
      display: grid;
      place-items: center;

      font-size: 19px;
    }

    .nav-label {
      margin-left: 14px;

      font-size: 14px;
      font-weight: 600;

      opacity: 0;
      transform: translateX(-8px);

      white-space: nowrap;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .sidebar:hover .nav-label {
      opacity: 1;
      transform: translateX(0);
    }

    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    main {
      margin-left: 105px;
      padding-right: 25px;

      transition: margin-left 0.3s ease;
    }

    .sidebar:hover ~ main {
      margin-left: 235px;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      min-height: 650px;

      display: flex;
      align-items: center;

      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          #08090d 0%,
          rgba(8, 9, 13, 0.88) 25%,
          rgba(8, 9, 13, 0.36) 62%,
          rgba(8, 9, 13, 0.72) 100%
        ),
        linear-gradient(
          0deg,
          #08090d 0%,
          transparent 28%,
          rgba(0, 0, 0, 0.12) 100%
        ),
        url("https://images.filmibeat.com/img/2025/09/kurukshetrad-1757488652.jpg")
        center / cover no-repeat;
    }

    .hero::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 70% 45%,
          rgba(255, 69, 20, 0.12),
          transparent 32%
        );

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;

      max-width: 680px;
      padding: 100px 30px 90px 25px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 15px;

      color: #ff7a45;
      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero-kicker::before {
      content: "";
      width: 28px;
      height: 2px;

      background: #ff4a1a;
      box-shadow: 0 0 10px rgba(255, 74, 26, 0.8);
    }

    /* Professional movie logo */

    .movie-logo {
      position: relative;

      width: fit-content;

      margin-bottom: 8px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(54px, 8vw, 100px);
      line-height: 0.9;

      font-weight: 900;
      letter-spacing: -4px;
      text-transform: uppercase;

      color: #fff;

      text-shadow:
        0 3px 0 #b3260b,
        0 8px 25px rgba(0, 0, 0, 0.75),
        0 0 30px rgba(255, 70, 20, 0.18);

      transform: skewX(-5deg);
    }

    .movie-logo::after {
      content: "";

      position: absolute;
      left: 4px;
      bottom: -13px;

      width: 72%;
      height: 4px;

      background: linear-gradient(
        90deg,
        #ff2600,
        #ff751f,
        transparent
      );

      box-shadow: 0 0 15px rgba(255, 65, 15, 0.6);

      transform: skewX(5deg);
    }

    .season-title {
      margin-top: 22px;
      margin-bottom: 22px;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.75);

      text-transform: uppercase;
    }

    .metadata {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;

      margin-bottom: 20px;

      color: rgba(255, 255, 255, 0.82);

      font-size: 14px;
      font-weight: 600;
    }

    .metadata span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .metadata .rating {
      color: #ffc247;
    }

    .meta-dot {
      opacity: 0.35;
    }

    .description {
      max-width: 600px;

      color: rgba(255, 255, 255, 0.72);

      font-size: 15px;
      line-height: 1.75;

      margin-bottom: 28px;
    }

    /* Hero buttons */

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .watch-btn {
      min-height: 50px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 0 27px;

      border-radius: 7px;

      background: linear-gradient(
        135deg,
        #ff2500,
        #ff6517
      );

      color: #fff;

      font-size: 14px;
      font-weight: 800;

      box-shadow:
        0 10px 30px rgba(255, 53, 13, 0.25);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
    }

    .watch-btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);

      box-shadow:
        0 14px 35px rgba(255, 53, 13, 0.4);
    }

    .whitelist-btn {
      min-height: 50px;
      min-width: 50px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 0 17px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;

      background: rgba(255, 255, 255, 0.08);
      color: #fff;

      backdrop-filter: blur(10px);

      font-size: 14px;
      font-weight: 700;

      transition:
        background 0.25s ease,
        transform 0.25s ease,
        border-color 0.25s ease;
    }

    .whitelist-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
    }

    .plus {
      width: 22px;
      height: 22px;

      display: grid;
      place-items: center;

      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;

      font-size: 17px;
      line-height: 1;
    }

    /* =========================================================
       MOVIE ROWS
    ========================================================= */

    .movie-section {
      position: relative;
      z-index: 5;

      margin-top: -15px;
      padding-bottom: 38px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .see-all {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .see-all:hover {
      color: #ff5a22;
    }

    .movie-row {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(145px, 1fr)
      );

      gap: 15px;

      padding: 7px 5px 25px;

      overflow: visible;
    }

    /* Movie card */

    .movie-card {
      position: relative;

      height: 215px;

      overflow: hidden;

      border-radius: 9px;

      background: #12141b;

      border: 1px solid rgba(255, 255, 255, 0.05);

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.25);

      transform: translateY(0) scale(1);

      transition:
        transform 0.3s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.3s ease,
        border-color 0.3s ease;

      will-change: transform;
    }

    .movie-card:hover {
      z-index: 20;

      transform:
        translateY(-7px)
        scale(1.065);

      border-color: rgba(255, 77, 25, 0.35);

      box-shadow:
        0 20px 42px rgba(0, 0, 0, 0.65),
        0 0 0 1px rgba(255, 75, 25, 0.08);
    }

    .movie-poster {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.45s cubic-bezier(.2,.8,.2,1),
        filter 0.35s ease;
    }

    .movie-card:hover .movie-poster {
      transform: scale(1.08);
      filter: brightness(0.65);
    }

    /* Card gradient */

    .movie-card::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 38%,
          rgba(0, 0, 0, 0.9) 100%
        );

      opacity: 0.7;

      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .movie-card:hover::after {
      opacity: 1;
    }

    /* Hover preview */

    .movie-preview {
      position: absolute;
      z-index: 3;

      inset: auto 10px 10px;

      transform: translateY(14px);

      opacity: 0;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .movie-card:hover .movie-preview {
      opacity: 1;
      transform: translateY(0);
    }

    .movie-title {
      margin-bottom: 5px;

      font-size: 14px;
      font-weight: 800;

      text-shadow: 0 2px 8px #000;
    }

    .movie-description {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

      margin-bottom: 10px;

      color: rgba(255, 255, 255, 0.72);

      font-size: 10px;
      line-height: 1.45;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .play-btn {
      width: 31px;
      height: 31px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #ff2600,
        #ff6419
      );

      color: #fff;

      font-size: 12px;

      box-shadow:
        0 5px 15px rgba(255, 60, 20, 0.3);

      transition: transform 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.12);
    }

    .card-add {
      width: 31px;
      height: 31px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.45);

      color: #fff;

      font-size: 18px;
    }

    /* =========================================================
       SECOND ROW
    ========================================================= */

    .movie-section + .movie-section {
      margin-top: 0;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      margin-left: 105px;

      padding: 35px 25px 45px;

      color: rgba(255, 255, 255, 0.38);

      text-align: center;

      font-size: 12px;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1100px) {

      .movie-row {
        grid-template-columns:
          repeat(5, minmax(135px, 1fr));
      }

      .movie-card {
        height: 205px;
      }
    }

    @media (max-width: 850px) {

      .sidebar {
        width: 62px;
        left: 12px;
        top: 12px;
        height: calc(100vh - 24px);
      }

      .sidebar:hover {
        width: 190px;
      }

      main {
        margin-left: 86px;
      }

      .sidebar:hover ~ main {
        margin-left: 215px;
      }

      .hero {
        min-height: 600px;
      }

      .hero-content {
        padding-left: 20px;
      }

      .movie-row {
        grid-template-columns:
          repeat(4, minmax(125px, 1fr));
      }
    }

    @media (max-width: 600px) {

      body {
        padding-bottom: 70px;
      }

      /* Mobile bottom navigation */

      .sidebar {
        position: fixed;

        left: 10px;
        right: 10px;
        bottom: 10px;
        top: auto;

        width: auto;
        height: 60px;

        padding: 7px 10px;

        flex-direction: row;
        align-items: center;

        border-radius: 17px;

        background: rgba(12, 14, 20, 0.82);
      }

      .sidebar:hover {
        width: auto;
      }

      .brand {
        display: none;
      }

      .nav {
        width: 100%;
        height: 100%;

        flex-direction: row;
        justify-content: space-around;
        align-items: center;

        gap: 2px;
      }

      .nav-link {
        min-height: 44px;
        min-width: 45px;

        padding: 0;

        justify-content: center;
      }

      .nav-link.active::before {
        display: none;
      }

      .nav-label {
        display: none;
      }

      .nav-icon {
        margin: 0;
      }

      main,
      .sidebar:hover ~ main {
        margin-left: 0;
        padding-right: 0;
      }

      .hero {
        min-height: 620px;

        align-items: flex-end;

        background:
          linear-gradient(
            0deg,
            #08090d 4%,
            rgba(8, 9, 13, 0.78) 38%,
            rgba(8, 9, 13, 0.2) 75%,
            rgba(8, 9, 13, 0.45) 100%
          ),
          url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=90")
          center top / cover no-repeat;
      }

      .hero-content {
        width: 100%;
        padding: 60px 20px 48px;
      }

      .movie-logo {
        font-size: clamp(48px, 15vw, 72px);
        letter-spacing: -3px;
      }

      .season-title {
        font-size: 10px;
        letter-spacing: 2.5px;
      }

      .metadata {
        font-size: 12px;
      }

      .description {
        font-size: 13px;
        line-height: 1.6;
      }

      .watch-btn {
        flex: 1;
      }

      .whitelist-btn {
        width: 52px;
        padding: 0;
      }

      .whitelist-text {
        display: none;
      }

      .movie-section {
        margin-top: 0;
        padding: 0 12px 25px;
      }

      .section-title {
        font-size: 17px;
      }

      .movie-row {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;

        padding: 4px 2px 20px;
      }

      .movie-card {
        height: 225px;
      }

      /*
        On touch devices there is no real hover.
        Keep cards compact until tapped/focused.
      */

      .movie-card:active,
      .movie-card:focus-within {
        transform:
          translateY(-5px)
          scale(1.025);
      }

      footer {
        margin-left: 0;
        padding: 20px 15px 95px;
      }
    }

    @media (max-width: 380px) {

      .movie-card {
        height: 205px;
      }

      .hero {
        min-height: 590px;
      }

      .hero-buttons {
        width: 100%;
      }
    }

    /* Reduced motion */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
